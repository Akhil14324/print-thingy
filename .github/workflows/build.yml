name: Build PrintStation installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Edit these to match your PCs. "printer" is matched against installed printer names
          # (a part of the name is enough). peerUrl links each page to the other printer's page.
          - name: PC1
            title: "Printer 1 - HP LaserJet Pro MFP M126a"
            printer: "M126"
            peerName: "Printer 2 - M1005"
            peerUrl: "http://PC2-NAME-OR-IP:8080"
          - name: PC2
            title: "Printer 2 - HP LaserJet M1005 MFP"
            printer: "M1005"
            peerName: "Printer 1 - M126a"
            peerUrl: "http://PC1-NAME-OR-IP:8080"
    steps:
      - uses: actions/checkout@v4

      - name: Download SumatraPDF (print engine)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest https://www.sumatrapdfreader.org/dl/rel/3.5.2/SumatraPDF-3.5.2-64.zip -OutFile tools/s.zip
          Expand-Archive tools/s.zip tools -Force
          Move-Item tools/SumatraPDF-3.5.2-64.exe tools/SumatraPDF.exe -Force

      - name: Build installer
        shell: pwsh
        run: >
          ./package.ps1
          -Name "${{ matrix.name }}"
          -Title "${{ matrix.title }}"
          -Printer "${{ matrix.printer }}"
          -PeerName "${{ matrix.peerName }}"
          -PeerUrl "${{ matrix.peerUrl }}"

      - uses: actions/upload-artifact@v4
        with:
          name: PrintStation-${{ matrix.name }}-Setup
          path: out/PrintStation-${{ matrix.name }}-Setup.exe
