name: Build PrintStation installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # "title" is the heading on the phone page. "printer" is matched against the installed
          # printer name (a part of the name is enough); leave it "" to use the PC's default printer.
          - name: Printer
            title: "Office Printer"
            printer: ""
    steps:
      - uses: actions/checkout@v4

      - name: Download SumatraPDF (print engine)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest https://www.sumatrapdfreader.org/dl/rel/3.5.2/SumatraPDF-3.5.2-64.zip -OutFile tools/s.zip
          Expand-Archive tools/s.zip tools -Force
          Move-Item tools/SumatraPDF-3.5.2-64.exe tools/SumatraPDF.exe -Force

      - name: Build installer
        shell: pwsh
        run: >
          ./package.ps1
          -Name "${{ matrix.name }}"
          -Title "${{ matrix.title }}"
          -Printer "${{ matrix.printer }}"
          -Pin "${{ secrets.PRINT_PIN }}"

      - uses: actions/upload-artifact@v4
        with:
          name: PrintStation-${{ matrix.name }}-Setup
          path: out/PrintStation-${{ matrix.name }}-Setup.exe
